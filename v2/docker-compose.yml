---
# BlackStarSIEM v2 – Full Stack Docker Compose
# -----------------------------------------------
# Services:
#   zookeeper   – Required by Kafka broker
#   kafka       – Apache Kafka (Confluent Community image)
#   schema-registry – Confluent Schema Registry (Avro/JSON schema management)
#   minio       – S3-compatible object storage (Iceberg warehouse)
#   mc          – MinIO client (creates buckets on startup)
#   spark       – Apache Spark master (with Iceberg runtime)
#   spark-worker– Spark worker
#   siem-v2     – BlackStarSIEM v2 Streamlit application
#
# Usage:
#   docker compose up -d
#   open http://localhost:8502   (SIEM v2 dashboard)
#   open http://localhost:9001   (MinIO console – user: minioadmin / minioadmin)
#   open http://localhost:9090   (Spark master UI)
#
# Note: Set KAFKA_BOOTSTRAP_SERVERS=kafka:29092 and S3_ENDPOINT=http://minio:9000
# when running the SIEM container inside this compose network.

version: "3.9"

networks:
  blackstar:
    driver: bridge

volumes:
  minio_data:
  kafka_data:
  spark_logs:

# ── Common Kafka environment shared across services ──────────────────────────
x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
  KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

services:

  # ── ZooKeeper ──────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    hostname: zookeeper
    container_name: blackstar-zookeeper
    networks: [blackstar]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka Broker ───────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    container_name: blackstar-kafka
    networks: [blackstar]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"       # external access
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Schema Registry ────────────────────────────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    hostname: schema-registry
    container_name: blackstar-schema-registry
    networks: [blackstar]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  # ── Create Kafka Topics ────────────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: blackstar-kafka-init
    networks: [blackstar]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic security.network --replication-factor 1 --partitions 4
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic security.auth    --replication-factor 1 --partitions 4
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic security.file    --replication-factor 1 --partitions 4
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic security.process --replication-factor 1 --partitions 4
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic security.alerts  --replication-factor 1 --partitions 2
      echo 'Kafka topics created.'
      "

  # ── MinIO (S3-compatible Iceberg warehouse) ────────────────────────────────
  minio:
    image: minio/minio:latest
    hostname: minio
    container_name: blackstar-minio
    networks: [blackstar]
    ports:
      - "9000:9000"       # S3 API
      - "9001:9001"       # MinIO console
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO client – create bucket ──────────────────────────────────────────
  mc:
    image: minio/mc:latest
    container_name: blackstar-mc
    networks: [blackstar]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/blackstar-warehouse;
        mc anonymous set download local/blackstar-warehouse;
        echo 'MinIO bucket ready.';
      "

  # ── Apache Spark Master ────────────────────────────────────────────────────
  spark:
    image: bitnami/spark:3.5
    hostname: spark
    container_name: blackstar-spark
    networks: [blackstar]
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "9090:8080"      # Spark master UI (mapped to 9090 to avoid conflict)
      - "7077:7077"      # Spark master port
    volumes:
      - spark_logs:/opt/bitnami/spark/logs

  # ── Apache Spark Worker ────────────────────────────────────────────────────
  spark-worker:
    image: bitnami/spark:3.5
    container_name: blackstar-spark-worker
    networks: [blackstar]
    depends_on: [spark]
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no

  # ── BlackStarSIEM v2 Dashboard ────────────────────────────────────────────
  siem-v2:
    build:
      context: .
      dockerfile: Dockerfile.v2
    container_name: blackstar-siem-v2
    networks: [blackstar]
    depends_on:
      - kafka
      - minio
    ports:
      - "8502:8502"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      ICEBERG_CATALOG_TYPE: sql
      ICEBERG_CATALOG_URI: sqlite:////data/blackstar_catalog.db
      ICEBERG_WAREHOUSE: s3://blackstar-warehouse/
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      DEMO_MODE: "false"
    volumes:
      - ./:/app
